<!DOCTYPE html>
<html lang="en-US">
    <head>
        <!-- 
        Name: Adam Sandfoehr
        File: storygenerator.html
        Date: July 28, 2026
        Desc: Assignment 4 - Part 1 | Javascript Basics
        -->
        <meta charset="utf-8">
        <title>Story Generator</title>
        <!-- link external JS, use defer so it's loaded AFTER html (can also put at bottom of HTML [browser loads HTML from top to bottom]) -->
        <script src="./script.js" defer></script>
    </head>
    <body>
        <a href="../../index.html">Homepage</a>
        <div>
            <label for="custom-name">Enter custom name:</label>
            <input id="custom-name" type="text" placeholder="">
        </div>
        <fieldset>
            <legend>Choose locale:</legend>
            <label for="us">US</label>
            <input id="us" type="radio" name="uk-us" value="us" checked>
            <label for="uk">UK</label>
            <input id="uk" type="radio" name="uk-us" value="uk">
        </fieldset>
        <div>
            <button class="generate">Generate random story</button>
        </div>
        <!-- Thanks a lot to Willy Aguirre for his help with the code for this assessment -->
        <p class="story"></p>
    </body>
</html>
